<!DOCTYPE html>
<html lang="ko">
<head>

<title>운빨 디펜스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff0e4;--fld:#b9d9c2;--path:#e8d9b0;--cell:#ffffff66;--ink:#1f2d3a;--btn:#2f6f6b;--btnx:#fff;--off:#8aa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17232b;--fld:#223a35;--path:#4a4636;--cell:#ffffff18;--ink:#eef3f6;--btn:#4fb3a6;--btnx:#08201d;--off:#4a5a60}}

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center}
#hud{display:flex;justify-content:space-between;width:min(480px,100%);padding:10px 16px;font-size:15px;box-sizing:border-box}
canvas{touch-action:none;width:min(480px,100%);aspect-ratio:360/340;display:block}

button{font:inherit;font-size:20px;border:0;border-radius:16px;padding:16px 6px;background:var(--btn);color:var(--btnx);cursor:pointer}

<body>

<script>
(function(){
var cv=document.getElementById('c'),cx=cv.getContext('2d'),SC=2;
var $=function(i){return document.getElementById(i)};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
// 밸런스 상수 (여기서 조절)
var K={startGold:1000,drawBase:100,drawMul:1.3,drawCap:1000,upBase:200,upStep:150,upBonus:.2,range:170,limit:100,shiny:.01,spawn:1.6,hp0:34,hpMul:1.5,gold0:10,goldMul:1.3,
 fireProc:.35,fireSplash:.2,waterSlow:.02,elecProc:.35,elecSplash:.1,elecShock:.15,shockT:.4,slowT:2,slowF:.5,grassCd:.01};
var MUL=[1,3.5,12];
var T=[
 {n:'불꽃',c:'#f28c3a',nm:['불똥이','불꽃룡','화염왕'],d:12,i:.8},
 {n:'물결',c:'#5aa9e6',nm:['물방이','파도거북','바다왕'],d:11,i:.8},
 {n:'새싹',c:'#6cc08b',nm:['새싹이','덩굴이','숲의 왕'],d:9,i:.8},
 {n:'번개',c:'#f2d13a',nm:['찌릿이','번개쥐','뇌전왕'],d:10,i:.75},

var COLS=5,ROWS=4;
function sx(c){return 92+c*44}function sy(r){return 102+r*44}
function pos(d){d=d%PL;if(d<300)return[30+d,40];if(d<560)return[330,40+d-300];if(d<860)return[330-(d-560),300];return[30,300-(d-860)];}

var units,enemies,fx,gold,wave,waveT,WT={},spawnT,drawN,upN,over,last,best=0,msgT=0,drag=null;

function drawCost(){return Math.min(K.drawCap,Math.round(K.drawBase*Math.pow(K.drawMul,drawN)/10)*10);}
function upCost(){return K.upBase+K.upStep*upN;}
function say(s){$('msg').textContent=s;msgT=2.5;}

  $('g').textContent='💰 '+gold+'원 · ⚔ '+kills;$('w').textContent='웨이브 '+wave+' · '+Math.ceil(waveT)+'초';$('l').textContent='👾 '+enemies.length+'/'+K.limit;
  $('bd').textContent='뽑기 '+drawCost()+'원';$('bu').textContent='공격 강화 Lv'+upN+' · '+upCost()+'원';
  $('bd').disabled=gold<drawCost()||over||!started;$('bu').disabled=gold<upCost()||over||!started;
}
function free(){var u={};units.forEach(function(x){u[x.sl]=1});var f=[];for(var i=0;i<COLS*ROWS;i++)if(!u[i])f.push(i);return f;}
function merge(){
  var ch=true;
  while(ch){ch=false;
    for(var k=0;k<T.length&&!ch;k++)for(var s=0;s<2&&!ch;s++){
      var l=units.filter(function(u){return u.k===k&&u.s===s}).sort(function(a,b){return (b.sh?1:0)-(a.sh?1:0);});
      if(l.length>=3){l.slice(1,3).forEach(function(u){units.splice(units.indexOf(u),1)});l[0].s=s+1;l[0].pop=.5;ch=true;say(T[k].nm[s+1]+'(으)로 진화!');snd('evo');}
    }}
}
$('bd').onclick=function(){
  var c=drawCost(),f=free();if(gold<c||over)return;

$('rs').onclick=function(){$('over').style.display='none';reset();started=false;showLobby();};
function pt(e){var b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*360,(e.clientY-b.top)/b.height*340];}
function cellAt(x,y){var c=Math.floor((x-70)/44),r=Math.floor((y-80)/44);return c>=0&&c<COLS&&r>=0&&r<ROWS?r*COLS+c:-1;}
cv.addEventListener('pointerdown',function(e){var p=pt(e),s=cellAt(p[0],p[1]);if(s<0||over)return;var u=units.filter(function(x){return x.sl===s})[0];if(u){drag={u:u,x:p[0],y:p[1]};cv.setPointerCapture(e.pointerId);}});

  if(k===3){if(Math.random()<K.elecProc)splash(e,dmg*K.elecSplash,'#f2d13a');if(Math.random()<K.elecShock)e.stun=K.shockT*(e.boss?.5:1);}

  units.forEach(function(u){
    if(u.pop>0)u.pop-=dt;if(u.at>0)u.at-=dt;if(u.gt>0)u.gt-=dt;
    u.cd-=dt;if(u.cd>0)return;

    enemies.forEach(function(e){var p=pos(e.d),dx=p[0]-ux,dy=p[1]-uy;if(e.hp-(e.pend||0)>0&&(e.age||0)>.6&&dx*dx+dy*dy<rg(u)*rg(u)&&(!tg||e.d>tg.d))tg=e;});
    if(!tg)return;
    var dmg=T[u.k].d*MUL[u.s]*(1+K.upBonus*upN)*atkMul(u.k),cdr=Math.min(.5,nearGrass(u)*K.grassCd);

  });
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.hp<=0){gold+=Math.round(K.gold0*Math.pow(K.goldMul,e.w-1))*(e.mid?3:e.boss?5:1);kills++;snd('die');if(e.mid)mbk++;else if(e.boss){fbk++;bossReward();}enemies.splice(i,1);ui();continue;}
    if(e.stun>0)e.stun-=dt;else e.d+=spd(e)*(e.slow>0?K.slowF:1)*dt;
    if(e.slow>0)e.slow-=dt;e.age=(e.age||0)+dt;

  }
  fx=fx.filter(function(f){f.t-=dt;if(f.tg&&!f.done){var q=pos(f.tg.d);f.x2=q[0];f.y2=q[1];if(f.t<=0){f.done=1;f.tg.pend=Math.max(0,(f.tg.pend||0)-f.dmg);if(f.tg.hp>0)hit(f.tg,f.dmg,f.u);}}return f.t>0;});
  if(enemies.length>K.limit&&!over){over=true;snd('over');awardShards();$('ot').textContent='게임 오버 · 웨이브 '+wave+' (최고 '+best+')'+gainText;$('over').style.display='flex';}
  ui();
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent='';}
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function unit(u,ts,ox,oy){
  var C=T[u.k],x=ox!==undefined?ox:sx(u.sl%COLS),y=oy!==undefined?oy:sy(Math.floor(u.sl/COLS)),r=9+u.s*3.5,sc=u.pop>0?1+u.pop:1;
  cx.save();cx.translate(x,y);cx.scale(sc,sc);
  cx.fillStyle=C.c;
  if(u.k===0){cx.fillStyle='#f25c3a';cx.beginPath();cx.moveTo(-r-6,2);cx.lineTo(-r+2,-5);cx.lineTo(-r+2,7);cx.fill();cx.fillStyle=C.c;}
  if(u.k===1){cx.fillStyle='#c9a46a';cx.beginPath();cx.ellipse(-r*.5,2,r*.7,r*.8,0,0,7);cx.fill();cx.fillStyle=C.c;}
  if(u.k===2){cx.fillStyle='#3f9a63';cx.beginPath();cx.arc(-2,-r,r*.6,0,7);cx.fill();cx.fillStyle=C.c;}
  if(u.k===3){cx.strokeStyle='#d9b400';cx.lineWidth=3;cx.beginPath();cx.moveTo(-r,0);cx.lineTo(-r-5,-5);cx.lineTo(-r-3,0);cx.lineTo(-r-8,-7);cx.stroke();}
  if(u.k===4){cx.fillStyle='#7aa83a';cx.beginPath();cx.arc(-r*.9,3,r*.5,0,7);cx.arc(-r*1.5,5,r*.35,0,7);cx.fill();cx.fillStyle=C.c;}
  cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();
  cx.fillStyle='#1f2d3a';cx.beginPath();cx.arc(r*.35,-r*.2,2.2,0,7);cx.fill();
  cx.restore();
  cx.fillStyle='#ffb400';for(var i=0;i<=u.s;i++){cx.beginPath();cx.arc(x-6+i*6,y+17,2.2,0,7);cx.fill();}
}
function enemy(e,x,y){
  var k=(e.w-1)%3;cx.save();if(e.boss){cx.translate(x,y);cx.scale(1.5,1.5);cx.translate(-x,-y);}
  if(k===0){cx.fillStyle='#8a5fc0';cx.beginPath();cx.arc(x-3,y+2,8,0,7);cx.arc(x+5,y-2,6,0,7);cx.fill();cx.fillStyle='#ffe066';cx.fillRect(x+4,y-4,2,2);cx.fillStyle='#e0525e';cx.fillRect(x+10,y-1,5,1.5);}
  else if(k===1){cx.fillStyle='#9a8fb5';cx.beginPath();cx.arc(x,y,8,0,7);cx.arc(x-7,y+4,4,0,7);cx.arc(x+7,y+4,4,0,7);cx.arc(x,y-8,4,0,7);cx.fill();cx.fillStyle='#2b2540';cx.fillRect(x-4,y-2,2,3);cx.fillRect(x+2,y-2,2,3);}
  else{cx.fillStyle='#f0e0b0';cx.beginPath();cx.arc(x,y,8,0,7);cx.fill();cx.beginPath();cx.moveTo(x-8,y-3);cx.lineTo(x-6,y-12);cx.lineTo(x-1,y-6);cx.moveTo(x+8,y-3);cx.lineTo(x+6,y-12);cx.lineTo(x+1,y-6);cx.fill();cx.fillStyle='#ffb400';cx.beginPath();cx.arc(x,y-5,2.5,0,7);cx.fill();cx.fillStyle='#2b2540';cx.fillRect(x-4,y,2,2);cx.fillRect(x+2,y,2,2);}
  if(e.stun>0||e.slow>0){cx.strokeStyle=e.stun>0?'#f2d13a':'#7aa8e0';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,12,0,7);cx.stroke();}
  cx.fillStyle=css('--ink');cx.font='8px sans-serif';cx.textAlign='center';cx.fillText(e.w,x,y+19);cx.restore();
}
function draw(ts){
  cx.setTransform(SC,0,0,SC,0,0);
  cx.fillStyle=css('--fld');cx.fillRect(0,0,360,340);
  cx.strokeStyle=css('--path');cx.lineWidth=18;cx.lineJoin='round';cx.beginPath();cx.rect(30,40,300,260);cx.stroke();
  for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){cx.fillStyle=css('--cell');rr(sx(c)-20,sy(r)-20,40,40,8);cx.fill();}
  units.forEach(function(u){if(!drag||drag.u!==u)unit(u,ts)});if(drag)unit(drag.u,ts,drag.x,drag.y);
  enemies.forEach(function(e){
    var p=pos(e.d),r=e.boss?14:9;enemy(e,p[0],p[1]);
    
    
    cx.fillStyle='#0006';cx.fillRect(p[0]-10,p[1]-r-6,20,3);cx.fillStyle='#4cd07a';cx.fillRect(p[0]-10,p[1]-r-6,20*Math.max(0,e.hp/e.mx),3);
  });
  fx.forEach(function(f){
    if(f.r){cx.strokeStyle=f.c;cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,22*(1-f.t*2),0,7);cx.stroke();}
    else{cx.strokeStyle=f.c;cx.lineWidth=2;cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(f.x2,f.y2);cx.stroke();}
  });
}
function mk(rows,pal,ov){var c=document.createElement('canvas');c.width=10;c.height=10;var g=c.getContext('2d');rows.forEach(function(r,y){for(var x=0;x<10;x++){var ch=r[x];if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}});(ov||[]).forEach(function(o){g.fillStyle=pal[o[2]];g.fillRect(o[0],o[1],1,1);});return c;}
var BASE=['...oooo...','..obbbbo..','..obwkbbo.','..obbbbbo.','.obbbbbbo.','.obblllbo.','.obblllbo.','..obbbbo..','..oo..oo..','..oo..oo..'];
function P(b,x){var p={o:'#2b2540',w:'#fff',k:'#1f2d3a',l:'#ffffff88',b:b};for(var q in x)p[q]=x[q];return p;}
var US=[
 mk(BASE,P('#f28c3a',{a:'#f25c3a',y:'#ffd25a'}),[[0,3,'a'],[0,4,'y'],[0,5,'a'],[1,2,'y']]),

 mk(BASE,P('#6cc08b',{g:'#3f9a63',r:'#e2587a'}),[[3,0,'g'],[4,0,'g'],[5,0,'g'],[6,0,'g'],[4,1,'g'],[5,1,'r']]),
 mk(BASE,P('#f2d13a',{t:'#d9b400'}),[[2,0,'k'],[7,0,'k'],[0,2,'t'],[0,3,'t'],[0,4,'t'],[1,3,'t']]),
 mk(BASE,P('#9bd04f',{r:'#e0525e',s:'#6f9a2f'}),[[3,0,'r'],[6,0,'r'],[2,6,'s'],[3,6,'s'],[6,6,'s'],[7,6,'s']])];
var ES=[
 mk(['...oooo...','..oppppo..','..opwkppo.','..oppppro.','...oppo.rr','..oooppo..','.oppppppo.','.oppssppo.','..oppppo..','...oooo...'],{o:'#2b2540',p:'#8a5fc0',s:'#d9c4f5',w:'#ffe066',k:'#2b2540',r:'#e0525e'}),
 mk(['..oo..oo..','.ogggoggo.','oggggggggo','ogwkggwkgo','oggggggggo','ogggmmgggo','oggggggggo','.ogggoggo.','..oo..oo..','..........'],{o:'#2b2540',g:'#9a8fb5',w:'#fff',k:'#2b2540',m:'#2b2540'}),
 mk(['.o......o.','.oo....oo.','occcccccco','occcyyccco','ocwkccwkco','occcnnccco','.occcccco.','.occllcco.','..oo..oo..','..........'],{o:'#2b2540',c:'#f0e0b0',y:'#ffb400',w:'#fff',k:'#2b2540',n:'#e0a0a0',l:'#d8c68e'})];
var BG=document.createElement('canvas');BG.width=720;BG.height=680;
(function(){var g=BG.getContext('2d'),s=7,i;function rnd(){s=(s*9301+49297)%233280;return s/233280;}
 g.scale(2,2);g.fillStyle='#4a8f4e';g.fillRect(0,0,360,340);
 for(i=0;i<260;i++){g.fillStyle=rnd()<.5?'#559a58':'#3f7f44';g.fillRect(rnd()*360,rnd()*340,2+rnd()*2,2);}
 for(i=0;i<45;i++){g.fillStyle=['#ffe066','#fff','#ff9ac0'][i%3];g.fillRect(rnd()*360,rnd()*340,2,2);}
 function tree(x,y,r){g.fillStyle='#5a3d28';g.fillRect(x-2,y,4,r);g.fillStyle='#2f6b3a';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#3b8447';g.beginPath();g.arc(x-r*.3,y-r*.3,r*.55,0,7);g.fill();}
 for(var x=8;x<360;x+=22){tree(x+rnd()*6,10+rnd()*6,10+rnd()*3);tree(x+rnd()*6,326+rnd()*6,10+rnd()*3);}

 g.lineJoin='round';g.strokeStyle='#9c7a4e';g.lineWidth=20;g.strokeRect(30,40,300,260);g.strokeStyle='#c8a977';g.lineWidth=14;g.strokeRect(30,40,300,260);
 for(i=0;i<70;i++){g.fillStyle='#a88b60';g.fillRect(rnd()*340+10,rnd()<.5?36+rnd()*8:296+rnd()*8,2,2);}
})();

function costOf(n){return n===1?5:n===2?10:10*(n-1);}
function atkMul(k){var L=LV[k];return 1+.1*Math.min(L,4)+.04*Math.max(0,L-4)+(k===4?.12*Math.max(0,Math.floor((L-5)/2)):0);}
function rg(u){return RG[u.k]*(1+u.s*.12)*(1+.02*Math.min(LV[u.k],10));}
function steps(k){var L=LV[k];return{cs:Math.max(0,Math.floor((L-4)/2)),ps:Math.max(0,Math.floor((L-5)/2))};}
function gval(L){return Math.min(.1,.03+.01*Math.max(0,L-6));}
function grassCdr(u){
 var L=LV[2];if(L<5)return 0;
 var c=u.sl%COLS,r=Math.floor(u.sl/COLS),b=0;
 units.forEach(function(g){if(g===u||g.k!==2)return;var dc=Math.abs(g.sl%COLS-c),dr=Math.abs(Math.floor(g.sl/COLS)-r);if(dc+dr===1||(L>=6&&dc===1&&dr===1))b=Math.max(b,gval(L));});
 return Math.min(.5,b);
}
function nearGrass(u){return grassCdr(u)/K.grassCd;}
function awardShards(){gain=Math.max(1,(wave-1)*3+mbk*2+fbk*4);META.shards+=gain;saveMeta();}
function hit(e,dmg,u){
 var k=u.k,p=pos(e.d),L=LV[k],s=steps(k);
 if((e.w-1)%3===0&&Math.random()<.3){fx.push({g:'miss',x:p[0],y:p[1],t:.5,T:.5});return;}
 e.hp-=dmg;
 if(L<5)return;
 if(k===0&&Math.random()<Math.min(.7,.2+.05*s.cs))splash(e,dmg*(.2+.05*s.ps),'fire');
 if(k===1&&!slowImm(e)&&Math.random()<Math.min(.6,.08+.04*s.cs)){e.slow=Math.max(e.slow,2+.5*s.ps);fx.push({g:'water',x:p[0],y:p[1],t:2,T:2});}
 if(k===3){if(Math.random()<Math.min(.7,.2+.05*s.cs))splash(e,dmg*(.1+.05*s.ps),'elec');if(Math.random()<Math.min(.5,.08+.03*s.cs))e.stun=(.4+.1*s.ps)*(e.boss?.5:1);}
 if(k===4&&!slowImm(e)){e.slow=Math.max(e.slow,2+.5*s.cs);fx.push({g:'web',x:p[0],y:p[1],t:1.5,T:1.5});}
}
function pct(v){return Math.round(v*100)+'%';}
function effText(k,dmg){
 var L=LV[k],s=steps(k);
 if(L<5)return '🔒 특수 효과는 강화 5레벨에서 열려요';
 if(k===0)return pct(Math.min(.7,.2+.05*s.cs))+' 확률로 앞뒤에 공격력의 '+pct(.2+.05*s.ps)+'('+Math.round(dmg*(.2+.05*s.ps))+') 범위 피해, 불바다';
 if(k===1)return pct(Math.min(.6,.08+.04*s.cs))+' 확률로 '+(2+.5*s.ps)+'초 슬로우(보스·가스구름 면역)';
 if(k===2)return '주변 '+(L>=6?'8':'4')+'칸 아군 스킬 간격 '+pct(gval(L))+' 단축(겹치지 않음)'+(L<6?' · Lv6에 대각선 해금':'');
 if(k===3)return pct(Math.min(.7,.2+.05*s.cs))+' 확률로 공격력의 '+pct(.1+.05*s.ps)+'('+Math.round(dmg*(.1+.05*s.ps))+') 범위 피해, '+pct(Math.min(.5,.08+.03*s.cs))+' 확률로 '+(.4+.1*s.ps).toFixed(1)+'초 감전';
 return '100% '+(2+.5*s.cs)+'초 슬로우(보스·가스구름 면역)'+(s.ps?', 공격력 +'+12*s.ps+'%':'');
}
function nextDesc(k,n){
 if(n<=4)return '공격력 +10%, 사거리 +2%';
 if(n===5)return '✨ 특수 효과 해금 (공격력 +4%)';
 var a=n%2===0;
 if(k===2)return n===6?'오로라가 대각선까지 확대, 공격력 +4%':'단축 효과 +1%, 공격력 +4%';
 return (a?'효과 확률 증가':'효과 위력 증가')+(k===4&&!a?'(공격력 +12%)':'')+', 공격력 +4%';
}
function showPop(u){
 var k=u.k,dmg=T[k].d*MUL[u.s]*(1+K.upBonus*upN)*atkMul(k),cdr=grassCdr(u),iv=T[k].i*(1-cdr)/(1+birdAs(u));
 pop.innerHTML='<b>'+(u.sh?'✨ ':'')+T[k].nm[u.s]+'</b> ('+T[k].n+' '+(u.s+1)+'단계 · 강화 Lv '+LV[k]+')<br>공격력 '+dmg.toFixed(1)+' · 공격 간격 '+iv.toFixed(2)+'초<br>초당 '+(dmg/iv).toFixed(1)+' · 사거리 '+Math.round(rg(u))+'<br>'+effText(k,dmg)+(cdr?'<br>받는 스킬 단축: '+pct(cdr):'')+'<br><small style="opacity:.7">눌러서 닫기</small>';
 pop.style.display='block';
}
var lobby=document.createElement('div');
lobby.style.cssText='position:fixed;inset:0;z-index:10;overflow:auto;background:var(--bg);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px;box-sizing:border-box;display:none';
document.body.appendChild(lobby);
function showLobby(){
 var h='<div style="max-width:480px;margin:0 auto"><h2 style="margin:0 0 4px;font-weight:400;font-size:28px">운빨 디펜스</h2><div style="font-size:20px;margin-bottom:10px">🧩 조각 '+META.shards+'</div>';
 for(var k=0;k<5;k++){
  var L=LV[k],n=L+1,mx=L>=MAXL,c=costOf(n);
  h+='<div style="display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--ink);border-radius:14px;margin-bottom:8px"><img src="'+US[k].toDataURL()+'" style="width:44px;height:44px;image-rendering:pixelated"><div style="flex:1;font-size:14px;line-height:1.4"><b style="font-size:17px">'+T[k].n+' Lv '+L+'</b><br>'+(mx?'최대 레벨':'다음: '+nextDesc(k,n))+'<br><span style="opacity:.8">'+effText(k,T[k].d*atkMul(k))+'</span></div><button data-k="'+k+'" '+((mx||META.shards<c)?'disabled':'')+' style="padding:10px 8px;font-size:15px;white-space:nowrap">'+(mx?'최대':'강화 🧩'+c)+'</button></div>';
 }
 h+='<button id="go" style="width:100%;margin-top:6px;font-size:22px;padding:16px">게임 시작</button><p style="font-size:13px;opacity:.75">조각은 게임이 끝날 때 웨이브와 보스 처치에 따라 얻어요. 특수 효과는 강화 5레벨부터 열려요.</p></div>';
 lobby.innerHTML=h;lobby.style.display='block';
 var bs=lobby.querySelectorAll('button[data-k]');
 for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){var kk=+b.getAttribute('data-k'),nn=LV[kk]+1,cc=costOf(nn);if(META.shards<cc||LV[kk]>=MAXL)return;META.shards-=cc;LV[kk]=nn;saveMeta();snd('up');showLobby();};})(bs[i]);
 document.getElementById('go').onclick=function(){lobby.style.display='none';started=true;reset();ui();};
}
var gainText='',NU=[0,0,0,5,3,7,10];
T.push({n:'바람',c:'#8fc4ff',nm:['깃털이','날개새','폭풍새'],d:4,i:.35},{n:'유령',c:'#8a6fd0',nm:['그림자','유령','악몽'],d:6,i:.9});
RG[5]=115;RG[6]=150;
US[5]=mk(['...oooo...','..obbbbo..','..obwkbyyy','..obbbbbo.','.oWWbbllo.','oWWWbblllo','.oWWbbbbo.','..obbbbo..','...o.o....','..........'],P('#c9a46a',{l:'#f0e0b0',y:'#f5a03a',W:'#8a6a3a'}));
US[6]=mk(['...oooo...','..oggggo..','.oggggggo.','.ogwkggwko','.oggggggo.','.ogmmmmgo.','.oggggggo.','oggggggggo','og.og.og.o','..........'],P('#8a6fd0',{g:'#8a6fd0',m:'#2b2540'}));
USS[5]=hueS(US[5],170);USS[6]=hueS(US[6],120);
META={sh:[15,15,15,0,0,0,0],lv:[0,0,0,0,0,0,0],cl:0};
try{var sv2=JSON.parse(localStorage.getItem('td-meta2')||'null');if(sv2&&sv2.sh&&sv2.lv&&sv2.sh.length===7&&sv2.lv.length===7)META=sv2;}catch(e){}
LV=META.lv;
function saveMeta(){try{localStorage.setItem('td-meta2',JSON.stringify(META));}catch(e){}}
function unlocked(k){return META.cl>=NU[k];}
function randType(){var a=[];for(var k=0;k<T.length;k++)if(unlocked(k))a.push(k);return a[Math.floor(Math.random()*a.length)];}
function asVal(g){return Math.min(.3,[.03,.06,.1][g.s]+.01*Math.max(0,LV[5]-6));}
function birdAs(u){
 if(LV[5]<5)return 0;
 var c=u.sl%COLS,r=Math.floor(u.sl/COLS),b=0;
 units.forEach(function(g){if(g===u||g.k!==5)return;if(Math.abs(g.sl%COLS-c)<=1&&Math.abs(Math.floor(g.sl/COLS)-r)<=1)b=Math.max(b,asVal(g));});
 return b;
}
function awardShards(){
 var base=Math.max(1,(wave-1)*3+mbk*2+fbk*4),used={},parts=[],k;
 units.forEach(function(u){used[u.k]=1;});
 var old=META.cl;
 for(k=0;k<T.length;k++){if(!unlocked(k))continue;var g=base+(used[k]?Math.ceil(base*.5):0);META.sh[k]+=g;parts.push(T[k].n+' 조각 +'+g);}
 META.cl=Math.max(META.cl,wave-1);
 var nu=[];for(k=0;k<T.length;k++)if(NU[k]>old&&META.cl>=NU[k])nu.push(T[k].n);
 gainText=' · 획득: '+parts.join(', ')+(nu.length?' · 🎉 새 유닛 해금: '+nu.join(', '):'');
 saveMeta();
}
function hit(e,dmg,u){
 var k=u.k,p=pos(e.d),L=LV[k],s=steps(k);
 if((e.w-1)%3===0&&Math.random()<.3){fx.push({g:'miss',x:p[0],y:p[1],t:.5,T:.5});return;}
 if(k===6&&e.boss)dmg*=2.5;
 e.hp-=dmg;
 if(L<5)return;
 if(k===0&&Math.random()<Math.min(.7,.2+.05*s.cs))splash(e,dmg*(.2+.05*s.ps),'fire');
 if(k===1&&!slowImm(e)&&Math.random()<Math.min(.6,.08+.04*s.cs)){e.slow=Math.max(e.slow,2+.5*s.ps);fx.push({g:'water',x:p[0],y:p[1],t:2,T:2});}
 if(k===3){if(Math.random()<Math.min(.7,.2+.05*s.cs))splash(e,dmg*(.1+.05*s.ps),'elec');if(Math.random()<Math.min(.5,.08+.03*s.cs))e.stun=(.4+.1*s.ps)*(e.boss?.5:1);}
 if(k===4&&!slowImm(e)){e.slow=Math.max(e.slow,2+.5*s.cs);fx.push({g:'web',x:p[0],y:p[1],t:1.5,T:1.5});}
 if(k===6&&(u.gt||0)<=0&&Math.random()<Math.min(.3,.08+.02*s.cs)){var pw=Math.min(.2,.1+.02*s.ps)*(e.boss?.5:1),v=Math.round(e.hp*pw);e.hp-=e.hp*pw;u.gt=10;fx.push({g:'ghost',x:p[0],y:p[1],t:.8,T:.8,v:v});}
}
function effText(k,dmg){
 var L=LV[k],s=steps(k);
 if(L<5)return '🔒 특수 효과는 강화 5레벨에서 열려요';
 if(k===0)return pct(Math.min(.7,.2+.05*s.cs))+' 확률로 앞뒤에 공격력의 '+pct(.2+.05*s.ps)+'('+Math.round(dmg*(.2+.05*s.ps))+') 범위 피해, 불바다';
 if(k===1)return pct(Math.min(.6,.08+.04*s.cs))+' 확률로 '+(2+.5*s.ps)+'초 슬로우(보스·가스구름 면역)';
 if(k===2)return '주변 '+(L>=6?'8':'4')+'칸 아군 스킬 간격 '+pct(gval(L))+' 단축(겹치지 않음)'+(L<6?' · Lv6에 대각선 해금':'');
 if(k===3)return pct(Math.min(.7,.2+.05*s.cs))+' 확률로 공격력의 '+pct(.1+.05*s.ps)+'('+Math.round(dmg*(.1+.05*s.ps))+') 범위 피해, '+pct(Math.min(.5,.08+.03*s.cs))+' 확률로 '+(.4+.1*s.ps).toFixed(1)+'초 감전';
 if(k===4)return '100% '+(2+.5*s.cs)+'초 슬로우(보스·가스구름 면역)'+(s.ps?', 공격력 +'+12*s.ps+'%':'');
 if(k===5)return '주변 8칸 아군 공격 속도 '+[0,1,2].map(function(x){return pct(asVal({s:x}));}).join(' / ')+'(단계별, 겹치지 않음)';
 return '공격 시 '+pct(Math.min(.3,.08+.02*s.cs))+' 확률로(10초에 1번) 현재 체력의 '+pct(Math.min(.2,.1+.02*s.ps))+' 제거(보스는 절반), 보스에게 피해 2.5배';
}
function nextDesc(k,n){
 if(n<=4)return '공격력 +10%, 사거리 +2%';
 if(n===5)return '✨ 특수 효과 해금 (공격력 +4%)';
 var a=n%2===0,t=', 공격력 +4%';
 if(k===2)return (n===6?'오로라가 대각선까지 확대':'단축 효과 +1%')+t;
 if(k===5)return '공속 버프 +1%'+t;
 if(k===6)return (a?'발동 확률 +2%':'제거량 +2%')+t;
 return (a?'효과 확률 증가':'효과 위력 증가')+(k===4&&!a?'(공격력 +12%)':'')+t;
}
function showLobby(){
 var h='<div style="max-width:480px;margin:0 auto"><h2 style="margin:0 0 4px;font-weight:400;font-size:28px">운빨 디펜스</h2><div style="font-size:14px;opacity:.8;margin-bottom:10px">클리어한 웨이브 '+META.cl+' · 유닛별 조각으로 강화해요</div>';
 for(var k=0;k<T.length;k++){
  if(!unlocked(k)){h+='<div style="padding:10px;border:2px dashed var(--ink);border-radius:14px;margin-bottom:8px;opacity:.6;font-size:15px">🔒 '+T[k].n+' — '+NU[k]+'웨이브 클리어 시 해금 (현재 '+META.cl+')</div>';continue;}
  var L=LV[k],n=L+1,mx=L>=MAXL,c=costOf(n),have=META.sh[k];
  h+='<div style="display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--ink);border-radius:14px;margin-bottom:8px"><img src="'+US[k].toDataURL()+'" style="width:44px;height:44px;image-rendering:pixelated"><div style="flex:1;font-size:14px;line-height:1.4"><b style="font-size:17px">'+T[k].n+' Lv '+L+'</b> <span style="opacity:.8">🧩 '+T[k].n+' 조각 '+have+'</span><br>'+(mx?'최대 레벨':'다음: '+nextDesc(k,n))+'<br><span style="opacity:.8">'+effText(k,T[k].d*atkMul(k))+'</span></div><button data-k="'+k+'" '+((mx||have<c)?'disabled':'')+' style="padding:10px 8px;font-size:15px;white-space:nowrap">'+(mx?'최대':'강화 🧩'+c)+'</button></div>';
 }
 h+='<button id="go" style="width:100%;margin-top:6px;font-size:22px;padding:16px">게임 시작</button><p style="font-size:13px;opacity:.75">조각은 게임이 끝날 때 해금된 유닛별로 얻어요. 특수 효과는 강화 5레벨부터 열려요.</p></div>';
 lobby.innerHTML=h;lobby.style.display='block';
 var bs=lobby.querySelectorAll('button[data-k]');
 for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){var kk=+b.getAttribute('data-k'),nn=LV[kk]+1,cc=costOf(nn);if(META.sh[kk]<cc||LV[kk]>=MAXL)return;META.sh[kk]-=cc;LV[kk]=nn;saveMeta();snd('up');showLobby();};})(bs[i]);
 document.getElementById('go').onclick=function(){lobby.style.display='none';started=true;reset();ui();};
}
showLobby();
function loop(ts){
  var dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(started&&!over)update(dt);
  draw(ts);requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
